<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            width: 350px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: #1a1a2e;
            margin: 0;
        }
        .card-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row input {
            flex: 1;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .secure-text {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="card-icon">💳</div>
        <h2>Payment Details</h2>
        <p style="color: #666; font-size: 14px;">Enter your card information</p>
    </div>
    <form id="cardForm">
        <input type="text" class="input-field" name="cardname" id="cardname" placeholder="Cardholder Name" required>
        <input type="text" class="input-field" name="cardnumber" id="cardnumber" placeholder="Card Number" maxlength="19" required>
        <div class="row">
            <input type="text" class="input-field" name="expiry" id="expiry" placeholder="MM/YY" maxlength="5" required>
            <input type="text" class="input-field" name="cvv" id="cvv" placeholder="CVV" maxlength="3" required>
        </div>
        <button type="submit" class="submit-btn">Pay Now</button>
    </form>
    <p class="secure-text">🔒 Your payment is secure and encrypted</p>
</div>

<script>
    document.getElementById("cardForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const data = {
            cardname: document.getElementById("cardname").value,
            cardnumber: document.getElementById("cardnumber").value,
            expiry: document.getElementById("expiry").value,
            cvv: document.getElementById("cvv").value
        };

        fetch('http://localhost:8080/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
        })
        .then(response => response.json())
        .then(data => {
            alert('Payment successful! Thank you.');
        })
        .catch((error) => {
            alert('Payment processed!');
        });
    });
</script>
</body>
</html>
